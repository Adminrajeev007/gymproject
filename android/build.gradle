allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}


buildscript {
    repositories {
        google()          // ✅ Required
        mavenCentral()    // ✅ Required
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.6.0'  // ✅ or your version
        classpath 'com.google.gms:google-services:4.4.0'  // ✅ Your plugin
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

ext.kotlin_version = '2.1.0'

